# OCUDU cell on an Ettus X310 (UBX-160) as the split-8 RU: TDD n78, 20 MHz,
# 30 kHz SCS, with the dApp runtime and the E3 interface enabled.
#
#   scripts/up
#
# Host prep (outside the container):
#   - 10 GbE link to the X310 on SFP+ port 1 (HG FPGA image), MTU 9000
#   - host address 192.168.40.1/24 on that interface; the radio is 192.168.40.2
#   - sysctl net.core.wmem_max / rmem_max = 62914560
#   - X310 FPGA image compatible with the UHD in the image (compat 39 for UHD 4.6;
#     update with uhd_image_loader and power-cycle)
#   - 10 MHz reference into REF IN

cu_cp:
  amf:
    no_core: false
    addr: 10.53.1.2
    port: 38412
    # Host networking: the ran network's bridge gateway, which routes to the 5GC.
    bind_addr: 10.53.1.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200

# Antennas: RF A TX/RX = downlink, RF A RX2 = uplink. RF B is unused.
ru_sdr:
  device_driver: uhd
  device_args: type=x300,addr=192.168.40.2,master_clock_rate=184.32e6,send_frame_size=8000,recv_frame_size=8000
  # Must divide master_clock_rate (184.32 / 23.04 = 8).
  srate: 23.04
  # RX-to-TX timing calibration in samples; X310/UBX-specific. Msg3 decode
  # depends on it.
  time_alignment_calibration: 128
  # 10 MHz reference on REF IN; no PPS, so sync stays internal.
  clock: external
  sync: internal
  # UBX-160 range is 0-31.5 dB. Set for a UE about 1 m away. For a more distant
  # UE raise both, watching `pusch` in the metrics table during a downlink
  # iperf: too much gain on either lowers it.
  tx_gain: 12
  rx_gain: 11
  expert_cfg:
    # continuous: two antennas (TX/RX + RX2). Use same-port for a single antenna.
    tx_mode: continuous
    # auto | enabled | disabled
    low_phy_prach_demodulation_acceleration_mode: auto

cell_cfg:
  dl_arfcn: 632628          # 3489.42 MHz
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  # Format 0 (long preamble). The auto-selected short format is not detected
  # over the air.
  prach:
    prach_config_index: 7
    preamble_rx_target_pw: -80

  nof_antennas_dl: 1
  nof_antennas_ul: 1
  # dl_ul_tx_period is in slots: 10 slots = 5 ms at 30 kHz SCS.
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 10
    nof_dl_slots: 6
    nof_dl_symbols: 8
    nof_ul_slots: 3
    nof_ul_symbols: 0
  csi:
    csi_rs_enabled: true
    csi_rs_period: 20
  pucch:
    formats: f1_and_f2
    nof_cell_csi_res: 1

dapp:
  catalog_root: /opt/ocudu/dapps
  native_preflight_helper: /opt/ocudu/bin/ocudu-dapp-preflight
  package_signature_mode: allow_unsigned
  minimum_trust_policy_epoch: 0
  package_manifests:
    - ref_channel_estimator_cpu.manifest.json
    - ref_equalizer_cpu.manifest.json
    - ref_receiver_cpu.manifest.json
    - ref_scheduler_cpu.manifest.json
    - ref_spectrum_cpu.manifest.json
    - ref_srs_isac_cpu.manifest.json
  local_e3:
    socket_path: /run/ocudu/dapp-management.sock
    request_timeout_ms: 1000
  e3ap_sctp:
    # The E3 endpoints have no authentication. Keep them on loopback unless a
    # network boundary protects them.
    bind_address: 127.0.0.1
    port: 36423
    ran_identifier: ocudu-x310-gnb
  e3dp_sctp:
    bind_address: 127.0.0.1
    port: 38472

expert_phy:
  # Run the uplink PHY on empty uplink slots, so the E3 spectrum stream
  # publishes with no UE attached.
  allow_request_on_empty_uplink_slot: true
  # Raises the PRACH detection threshold; suppresses false preambles with
  # format 0.
  prach_th_correction_factor: 4.0
  # GPU acceleration per channel: auto | enabled | disabled. PUSCH stays on the
  # CPU.
  pdsch_acceleration_mode: auto
  pusch_acceleration_mode: disabled
  prach_acceleration_mode: auto
  srs_acceleration_mode: auto

metrics:
  autostart_stdout_metrics: true
  enable_json: true

remote_control:
  bind_addr: 127.0.0.1
  enabled: true

log:
  filename: /tmp/gnb.log
  # Keep at warning on a real radio: info-level PHY logging misses slot
  # deadlines.
  all_level: warning
  mac_level: info
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
