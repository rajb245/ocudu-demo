# OCUDU cell on the ZeroMQ virtual radio, with the OAI nrUE as the peer: TDD
# n78, 20 MHz, 30 kHz SCS, with the dApp runtime and the E3 interface enabled.
#
#   scripts/up zmq

cu_cp:
  amf:
    no_core: false
    addr: 10.53.1.2                 # Open5GS AMF.
    port: 38412
    bind_addr: 10.53.1.3            # Local address the gNB binds for NGAP.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://0.0.0.0:4556,rx_port=tcp://oai_nr_ue:4557
  srate: 23.04
  # Digital amplitude on the ZMQ link, <= 0 dB. The OAI nrUE has no AGC on ZMQ;
  # -30 puts its receive level at OAI's 50 dB target. At 0 its receiver
  # saturates and higher MCS fail.
  tx_gain: -30
  rx_gain: 0

cell_cfg:
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 2
  csi:
    csi_rs_enabled: true
    csi_rs_period: 20
  pucch:
    formats: f1_and_f2
    nof_cell_csi_res: 1

# Unsigned packages are admitted, and E3AP listens on the container's RAN
# address so clients can reach it from the host. The E3 endpoints have no
# authentication: keep them inside the compose network.
dapp:
  catalog_root: /opt/ocudu/dapps
  native_preflight_helper: /opt/ocudu/bin/ocudu-dapp-preflight
  package_signature_mode: allow_unsigned
  # Required with allow_unsigned (no trust store).
  minimum_trust_policy_epoch: 0
  # Declared, not started: load and activate them over E3 (see README).
  package_manifests:
    - ref_channel_estimator_cpu.manifest.json
    - ref_equalizer_cpu.manifest.json
    - ref_receiver_cpu.manifest.json
    - ref_scheduler_cpu.manifest.json
    - ref_spectrum_cpu.manifest.json
    - ref_srs_isac_cpu.manifest.json
  local_e3:
    socket_path: /run/ocudu/dapp-management.sock
    request_timeout_ms: 1000
  e3ap_sctp:
    bind_address: 0.0.0.0
    port: 36423
    ran_identifier: ocudu-demo-gnb
  e3dp_sctp:
    bind_address: 0.0.0.0
    port: 38472

expert_phy:
  # Run the uplink PHY on empty uplink slots, so the E3 spectrum stream
  # publishes whenever the UE is sending samples.
  allow_request_on_empty_uplink_slot: true

metrics:
  autostart_stdout_metrics: true
  enable_json: true

remote_control:
  bind_addr: 0.0.0.0
  enabled: true

log:
  filename: /tmp/gnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
